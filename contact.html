<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" type="image/png" href="images/favicon.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><title>Contact | RATEOUT STORE</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/contact.css"></head>
<body data-page="contact">
<div id="site-header"></div>
<main><div class="wrap">
  <div class="page-title"><h1>Contact</h1><p>Questions about an order, size or delivery? Send a message below and WhatsApp will open.</p></div>
  <div class="contact-grid" style="margin-top:34px">
    <div class="c-list" id="cList"></div>
    <form class="form" id="cForm">
      <label>Your name<input name="name" required placeholder="Full name"></label>
      <label>How can we help?<select name="topic"><option>I want to place an order</option><option>I need help with sizing</option><option>Question about delivery</option><option>Something else</option></select></label>
      <label>Message<textarea name="msg" placeholder="Write your message..."></textarea></label>
      <button class="btn" type="submit">Send on WhatsApp</button>
    </form>
  </div>
</div><div style="height:70px"></div></main>
<div id="site-footer"></div>
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/common.js"></script><script src="js/contact.js"></script>
</body></html>
