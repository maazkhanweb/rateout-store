<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><link rel="icon" type="image/png" href="images/favicon.png"><link rel="apple-touch-icon" href="images/apple-touch-icon.png"><title>Admin Login | RATEOUT STORE</title>
<link rel="stylesheet" href="css/base.css"><link rel="stylesheet" href="css/login.css"></head>
<body data-page="login">
<div id="site-header"></div>
<main class="login-wrap">
  <form class="login-card" id="loginForm" autocomplete="off">
    <h1>Admin login</h1>
    <p>For the store owner only.</p>
    <label>Username<input name="u" required autocomplete="username"></label>
    <label>Password<input name="p" type="password" required autocomplete="current-password"></label>
    <p class="err" id="err" role="alert" hidden>Incorrect username or password.</p>
    <button class="btn" type="submit">Log in</button>
  </form>
</main>
<script src="js/config.js"></script><script src="js/store.js"></script><script src="js/common.js"></script><script src="js/login.js"></script>
</body></html>
